<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Model and effort tiers with output price per million tokens">
  <style>
    text { font-family: "Styrene B", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F5F4EE; }
    .serif { font-family: "Tiempos Headline", "Copernicus", Georgia, "Times New Roman", serif; }
    .h { font-size: 13px; fill: #A8A59B; letter-spacing: .03em; }
    .tier { font-size: 16px; }
    .who { font-size: 12px; fill: #A8A59B; }
    .val { font-size: 12.5px; fill: #A8A59B; }
    .grid { stroke: #45443F; stroke-width: 1; }
  </style>
  <rect width="960" height="330" rx="14" fill="#262624"/>
  <text class="h" x="24" y="34">MODEL · EFFORT PER ROLE   ·   bar = output price per 1M tokens, Nov 2026</text>

  <line class="grid" x1="380" y1="52" x2="380" y2="292"/>

  <text class="tier serif" x="24" y="80">Critical · opus xhigh</text>
  <text class="who" x="24" y="98">planner, skeptics, reviewer, moderator</text>
  <rect x="380" y="68" width="400" height="22" rx="4" fill="#D97757"/>
  <text class="val" x="790" y="84">$20</text>

  <text class="tier serif" x="24" y="128">Build · opus high</text>
  <text class="who" x="24" y="146">coders, quote-builder</text>
  <rect x="380" y="116" width="400" height="22" rx="4" fill="#D97757" opacity=".78"/>
  <text class="val" x="790" y="132">$20</text>

  <text class="tier serif" x="24" y="176">Craft · opus medium</text>
  <text class="who" x="24" y="194">outreach-writer, copywriter</text>
  <rect x="380" y="164" width="400" height="22" rx="4" fill="#D97757" opacity=".56"/>
  <text class="val" x="790" y="180">$20</text>

  <text class="tier serif" x="24" y="224">Analyst · sonnet medium</text>
  <text class="who" x="24" y="242">tester, researcher, scouts, council members</text>
  <rect x="380" y="212" width="200" height="22" rx="4" fill="#D4A27F"/>
  <text class="val" x="590" y="228">$10</text>

  <text class="tier serif" x="24" y="272">Fast · haiku low</text>
  <text class="who" x="24" y="290">code search, lookups, sitemaps</text>
  <rect x="380" y="260" width="10" height="22" rx="3" fill="#E8DCC8"/>
  <text class="val" x="400" y="276">$0.50</text>

  <text class="who" x="24" y="318">Higher effort = more thinking tokens on the same model. Escalation (opus · max) only after two failed attempts.</text>
</svg>

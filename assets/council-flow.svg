<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Council: five members debate in rounds, moderator tallies against a 60 percent threshold">
  <style>
    text { font-family: "Styrene B", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F5F4EE; }
    .serif { font-family: "Tiempos Headline", "Copernicus", Georgia, "Times New Roman", serif; }
    .card { fill: #30302E; stroke: #45443F; stroke-width: 1.2; }
    .h { font-size: 13px; fill: #A8A59B; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .name { font-size: 14.5px; }
    .title { font-size: 17px; }
    .sub { font-size: 12px; fill: #A8A59B; }
    .arrow { stroke: #75736A; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#75736A"/></marker></defs>
  <rect width="960" height="280" rx="14" fill="#262624"/>
  <text class="h" x="24" y="34">/council:vote &lt;question&gt;</text>

  <rect class="card" x="24" y="56" width="176" height="34" rx="8"/><circle cx="42" cy="73" r="6" fill="#8FA876"/><text class="name serif" x="56" y="78">optimist</text><text class="sub" x="128" y="78">upside</text>
  <rect class="card" x="24" y="96" width="176" height="34" rx="8"/><circle cx="42" cy="113" r="6" fill="#D97757"/><text class="name serif" x="56" y="118">skeptic</text><text class="sub" x="128" y="118">risks</text>
  <rect class="card" x="24" y="136" width="176" height="34" rx="8"/><circle cx="42" cy="153" r="6" fill="#7FA7C9"/><text class="name serif" x="56" y="158">engineer</text><text class="sub" x="128" y="158">effort</text>
  <rect class="card" x="24" y="176" width="176" height="34" rx="8"/><circle cx="42" cy="193" r="6" fill="#D4A27F"/><text class="name serif" x="56" y="198">business</text><text class="sub" x="128" y="198">money</text>
  <rect class="card" x="24" y="216" width="176" height="34" rx="8"/><circle cx="42" cy="233" r="6" fill="#B49AC4"/><text class="name serif" x="56" y="238">client</text><text class="sub" x="128" y="238">other side</text>

  <path class="arrow" d="M206 153 H262"/>
  <rect class="card" x="264" y="96" width="190" height="114" rx="10"/>
  <text class="title serif" x="282" y="126">Round 1</text>
  <text class="sub" x="282" y="146">independent positions,</text>
  <text class="sub" x="282" y="162">evidence, vote +</text>
  <text class="sub" x="282" y="178">confidence (in parallel)</text>

  <path class="arrow" d="M454 153 H492"/>
  <rect class="card" x="494" y="96" width="190" height="114" rx="10"/>
  <text class="title serif" x="512" y="126">Round 2</text>
  <text class="sub" x="512" y="146">everyone reads everyone,</text>
  <text class="sub" x="512" y="162">answers the strongest</text>
  <text class="sub" x="512" y="178">counter-argument by name</text>

  <path class="arrow" d="M684 153 H722"/>
  <rect x="724" y="76" width="212" height="154" rx="10" fill="#30302E" stroke="#D97757" stroke-width="2"/>
  <circle cx="744" cy="104" r="6" fill="#D97757"/><text class="title serif" x="758" y="110">moderator</text>
  <text class="sub" x="744" y="134">checks the key evidence</text>
  <text class="sub" x="744" y="152">YES share and confidence-</text>
  <text class="sub" x="744" y="168">weighted share ≥ 60 %</text>
  <text class="sub" x="744" y="192">→ PASSED / REJECTED /</text>
  <text class="sub" x="744" y="208">   NO CONSENSUS + next step</text>
</svg>

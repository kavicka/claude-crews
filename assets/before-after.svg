<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Same task, vibe coding versus crew:ship: hidden tests 11 of 12 versus 12 of 12, test suite 11 versus 23 tests, 67 seconds versus 13.8 minutes, 96 thousand versus 601 thousand subagent tokens">
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --vibe:#8c959f; --crew:#8250df; --bad:#cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --vibe:#6e7681; --crew:#ab7df8; --bad:#f85149; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .h { font-size: 13px; fill: var(--muted); letter-spacing: .04em; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .lab { font-size: 12px; fill: var(--muted); }
    .val { font-size: 13px; font-weight: 600; }
    .vibe { fill: var(--vibe); }
    .crew { fill: var(--crew); }
    .grid { stroke: var(--line); }
    .bad { fill: var(--bad); font-size: 12.5px; font-weight: 600; }
  </style>
  <rect class="bg" width="960" height="400" rx="12"/>
  <text class="h" x="24" y="34">SAME TASK, SAME MODEL FAMILY — "let checkout accept several coupon codes"  (real run, 2026-11-03)</text>
  <rect class="vibe" x="24" y="50" width="12" height="12" rx="2"/><text class="lab" x="42" y="60">vibe coding: one prompt, one agent (opus · medium)</text>
  <rect class="crew" x="380" y="50" width="12" height="12" rx="2"/><text class="lab" x="398" y="60">/crew:ship: planner → skeptic → coder + tester → reviewer → fix</text>

  <!-- panel 1: hidden tests -->
  <text class="t" x="24" y="100">Hidden acceptance tests</text>
  <text class="s" x="24" y="117">12 tests neither run saw · higher is better</text>
  <line class="grid" x1="24" y1="128" x2="444" y2="128"/>
  <rect class="vibe" x="24" y="136" width="367" height="20" rx="4"/><text class="val" x="399" y="151">11/12</text>
  <rect class="crew" x="24" y="162" width="400" height="20" rx="4"/><text class="val" x="432" y="177" style="fill:var(--crew)">12/12</text>

  <!-- panel 2: tests -->
  <text class="t" x="504" y="100">Tests in the suite afterwards</text>
  <text class="s" x="504" y="117">started with 4 · higher is better</text>
  <line class="grid" x1="504" y1="128" x2="924" y2="128"/>
  <rect class="vibe" x="504" y="136" width="191" height="20" rx="4"/><text class="val" x="703" y="151">11</text>
  <rect class="crew" x="504" y="162" width="400" height="20" rx="4"/><text class="val" x="912" y="177" style="fill:var(--crew)">23</text>

  <!-- panel 3: time -->
  <text class="t" x="24" y="230">Agent wall-clock time</text>
  <text class="s" x="24" y="247">excludes the human checkpoint · lower is cheaper</text>
  <line class="grid" x1="24" y1="258" x2="444" y2="258"/>
  <rect class="vibe" x="24" y="266" width="32" height="20" rx="4"/><text class="val" x="64" y="281">67 s</text>
  <rect class="crew" x="24" y="292" width="400" height="20" rx="4"/><text class="val" x="432" y="307" style="fill:var(--crew)">13.8 min</text>

  <!-- panel 4: tokens -->
  <text class="t" x="504" y="230">Subagent tokens</text>
  <text class="s" x="504" y="247">as reported by Claude Code, mostly cached prompt reads · lower is cheaper</text>
  <line class="grid" x1="504" y1="258" x2="924" y2="258"/>
  <rect class="vibe" x="504" y="266" width="64" height="20" rx="4"/><text class="val" x="576" y="281">96 k</text>
  <rect class="crew" x="504" y="292" width="400" height="20" rx="4"/><text class="val" x="912" y="307" style="fill:var(--crew)">601 k</text>

  <text class="bad" x="24" y="350">Bug left in the vibe version: the same two coupons give a different price depending on the order you type them (1035 vs 1036 cents).</text>
  <text class="s" x="24" y="372">Found by the crew's reviewer, then confirmed against the vibe code. Raw diffs, transcripts and the hidden test file are in examples/coupon-demo.</text>
</svg>

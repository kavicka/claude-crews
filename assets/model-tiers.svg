<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Model and effort tiers with output price per million tokens">
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --opus:#8250df; --sonnet:#0969da; --haiku:#1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --opus:#ab7df8; --sonnet:#4493f8; --haiku:#3fb950; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .h { font-size: 13px; fill: var(--muted); letter-spacing: .04em; }
    .tier { font-size: 14px; font-weight: 600; }
    .who { font-size: 12px; fill: var(--muted); }
    .val { font-size: 12px; fill: var(--muted); }
    .grid { stroke: var(--line); stroke-width: 1; }
    .opus { fill: var(--opus); }
    .sonnet { fill: var(--sonnet); }
    .haiku { fill: var(--haiku); }
  </style>
  <rect class="bg" width="960" height="330" rx="12"/>
  <text class="h" x="24" y="34">MODEL · EFFORT PER ROLE   (bar = output price per 1M tokens, Nov 2026)</text>

  <line class="grid" x1="380" y1="52" x2="380" y2="292"/>

  <text class="tier" x="24" y="80">Critical · opus xhigh</text>
  <text class="who" x="24" y="98">planner, skeptics, reviewer, moderator</text>
  <rect class="opus" x="380" y="68" width="400" height="22" rx="4"/>
  <text class="val" x="790" y="84">$20</text>

  <text class="tier" x="24" y="128">Build · opus high</text>
  <text class="who" x="24" y="146">coders, quote-builder</text>
  <rect class="opus" x="380" y="116" width="400" height="22" rx="4" opacity=".8"/>
  <text class="val" x="790" y="132">$20</text>

  <text class="tier" x="24" y="176">Craft · opus medium</text>
  <text class="who" x="24" y="194">outreach-writer, copywriter</text>
  <rect class="opus" x="380" y="164" width="400" height="22" rx="4" opacity=".6"/>
  <text class="val" x="790" y="180">$20</text>

  <text class="tier" x="24" y="224">Analyst · sonnet medium</text>
  <text class="who" x="24" y="242">tester, researcher, scouts, council members</text>
  <rect class="sonnet" x="380" y="212" width="200" height="22" rx="4"/>
  <text class="val" x="590" y="228">$10</text>

  <text class="tier" x="24" y="272">Fast · haiku low</text>
  <text class="who" x="24" y="290">code search, lookups, sitemaps</text>
  <rect class="haiku" x="380" y="260" width="10" height="22" rx="3"/>
  <text class="val" x="400" y="276">$0.50</text>

  <text class="who" x="24" y="318">Higher effort = more thinking tokens on the same model. Escalation (opus · max) only after two failed attempts.</text>
</svg>

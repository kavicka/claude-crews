<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Council: five members debate in rounds, moderator tallies against a 60 percent threshold">
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --card:#f6f8fa; --g:#1a7f37; --r:#cf222e; --b:#0969da; --y:#9a6700; --p:#8250df; --c:#0e7490; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --card:#151b23; --g:#3fb950; --r:#f85149; --b:#4493f8; --y:#d29922; --p:#ab7df8; --c:#39c5cf; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .h { font-size: 13px; fill: var(--muted); letter-spacing: .04em; }
    .name { font-size: 13.5px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: var(--muted); }
    .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
  <rect class="bg" width="960" height="280" rx="12"/>
  <text class="h" x="24" y="34">/council:vote &lt;question&gt;</text>

  <g>
    <rect class="card" x="24" y="56" width="170" height="34" rx="8"/><circle cx="42" cy="73" r="6" fill="var(--g)"/><text class="name" x="56" y="78">optimist</text><text class="sub" x="122" y="78">upside</text>
    <rect class="card" x="24" y="96" width="170" height="34" rx="8"/><circle cx="42" cy="113" r="6" fill="var(--r)"/><text class="name" x="56" y="118">skeptic</text><text class="sub" x="122" y="118">risks</text>
    <rect class="card" x="24" y="136" width="170" height="34" rx="8"/><circle cx="42" cy="153" r="6" fill="var(--b)"/><text class="name" x="56" y="158">engineer</text><text class="sub" x="122" y="158">effort</text>
    <rect class="card" x="24" y="176" width="170" height="34" rx="8"/><circle cx="42" cy="193" r="6" fill="var(--y)"/><text class="name" x="56" y="198">business</text><text class="sub" x="122" y="198">money</text>
    <rect class="card" x="24" y="216" width="170" height="34" rx="8"/><circle cx="42" cy="233" r="6" fill="var(--p)"/><text class="name" x="56" y="238">client</text><text class="sub" x="122" y="238">other side</text>
  </g>

  <path class="arrow" d="M200 153 H262"/>
  <rect class="card" x="264" y="96" width="190" height="114" rx="10"/>
  <text class="name" x="282" y="124">Round 1</text>
  <text class="sub" x="282" y="144">independent positions,</text>
  <text class="sub" x="282" y="160">evidence, vote +</text>
  <text class="sub" x="282" y="176">confidence (in parallel)</text>

  <path class="arrow" d="M454 153 H492"/>
  <rect class="card" x="494" y="96" width="190" height="114" rx="10"/>
  <text class="name" x="512" y="124">Round 2</text>
  <text class="sub" x="512" y="144">everyone reads everyone,</text>
  <text class="sub" x="512" y="160">answers the strongest</text>
  <text class="sub" x="512" y="176">counter-argument by name</text>

  <path class="arrow" d="M684 153 H722"/>
  <rect class="card" x="724" y="76" width="212" height="154" rx="10" style="stroke:var(--c);stroke-width:2"/>
  <circle cx="744" cy="104" r="6" fill="var(--c)"/><text class="name" x="758" y="109">moderator</text>
  <text class="sub" x="744" y="132">checks the key evidence</text>
  <text class="sub" x="744" y="150">YES share and confidence-</text>
  <text class="sub" x="744" y="166">weighted share ≥ 60 %</text>
  <text class="sub" x="744" y="190">→ PASSED / REJECTED /</text>
  <text class="sub" x="744" y="206">   NO CONSENSUS + next step</text>
</svg>

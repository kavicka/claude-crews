<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 638" width="760" height="638" role="img" aria-label="Animated council debate from a real run">
<style>
text{font-family:"Styrene B","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#F5F4EE}
.bub{fill:#30302E;stroke:#45443F}
.ini{font-size:13px;font-weight:700;fill:#262624;text-anchor:middle}
.who{font-size:12.5px;font-weight:700}
.head{font-family:"Tiempos Headline","Copernicus",Georgia,"Times New Roman",serif;font-size:16px}
.line{font-size:13px;fill:#A8A59B}
.vote{font-size:12px;font-weight:700;text-anchor:middle}
.top{font-size:12px;fill:#A8A59B;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.b{opacity:0;animation-duration:20.0s;animation-iteration-count:infinite;animation-timing-function:ease-out}
@media (prefers-reduced-motion: reduce){.b{animation:none;opacity:1}}
@keyframes m0{0%,3.0%{opacity:0;transform:translateY(8px)}6.0%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes m1{0%,14.5%{opacity:0;transform:translateY(8px)}17.5%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes m2{0%,26.0%{opacity:0;transform:translateY(8px)}29.0%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes m3{0%,37.5%{opacity:0;transform:translateY(8px)}40.5%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes m4{0%,49.0%{opacity:0;transform:translateY(8px)}52.0%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes m5{0%,60.5%{opacity:0;transform:translateY(8px)}63.5%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
@keyframes m6{0%,72.0%{opacity:0;transform:translateY(8px)}75.0%,93%{opacity:1;transform:translateY(0)}98%,100%{opacity:0}}
</style>
<rect width="760" height="638" rx="14" fill="#262624"/>
<text x="20" y="36" class="top">#council · real run, excerpts · full transcript in examples/council-demo</text>
<g class="b" style="animation-name:m0">
<rect x="64" y="58" width="676" height="68" rx="12" class="bub"/>
<circle cx="36" cy="75" r="14" fill="#E8DCC8"/>
<text x="36" y="80" class="ini">Y</text>
<text x="78" y="79" class="who" fill="#E8DCC8">you</text>
<text x="78" y="100" class="head">/council:vote --full Should Maya take the 6-month contract?</text>
<text x="78" y="120" class="line">11 000 €/month for 6 months, but she must pause her 3-year client A.</text>
</g>
<g class="b" style="animation-name:m1">
<rect x="64" y="136" width="676" height="68" rx="12" class="bub"/>
<circle cx="36" cy="153" r="14" fill="#8FA876"/>
<text x="36" y="158" class="ini">O</text>
<text x="78" y="157" class="who" fill="#8FA876">optimist</text>
<text x="78" y="178" class="head">Take it, but negotiate the transition first.</text>
<text x="78" y="198" class="line">+30 000 € gross in 6 months; payments work raises her rates.</text>
<rect x="654" y="145" width="72" height="22" rx="11" fill="#8FA876" opacity=".18"/>
<text x="690" y="160" class="vote" fill="#8FA876">YES 70</text>
</g>
<g class="b" style="animation-name:m2">
<rect x="64" y="214" width="676" height="68" rx="12" class="bub"/>
<circle cx="36" cy="231" r="14" fill="#D97757"/>
<text x="36" y="236" class="ini">S</text>
<text x="78" y="235" class="who" fill="#D97757">skeptic</text>
<text x="78" y="256" class="head">Not as set up. A will be lost, not paused.</text>
<text x="78" y="276" class="line">A year without A costs 33 600 €, more than the whole gain.</text>
<rect x="654" y="223" width="72" height="22" rx="11" fill="#D97757" opacity=".18"/>
<text x="690" y="238" class="vote" fill="#D97757">NO 65</text>
</g>
<g class="b" style="animation-name:m3">
<rect x="64" y="292" width="676" height="68" rx="12" class="bub"/>
<circle cx="36" cy="309" r="14" fill="#7FA7C9"/>
<text x="36" y="314" class="ini">E</text>
<text x="78" y="313" class="who" fill="#7FA7C9">engineer</text>
<text x="78" y="334" class="head">Take it if A and B commit to a return path.</text>
<text x="78" y="354" class="line">Low technical risk; the 3-week start is the danger.</text>
<rect x="654" y="301" width="72" height="22" rx="11" fill="#8FA876" opacity=".18"/>
<text x="690" y="316" class="vote" fill="#8FA876">YES 70</text>
</g>
<g class="b" style="animation-name:m4">
<rect x="64" y="370" width="676" height="68" rx="12" class="bub"/>
<circle cx="36" cy="387" r="14" fill="#B49AC4"/>
<text x="36" y="392" class="ini">C</text>
<text x="78" y="391" class="who" fill="#B49AC4">client A</text>
<text x="78" y="412" class="head">&quot;Maybe&quot; means I&#x27;ll replace you by month 3.</text>
<text x="78" y="432" class="line">Keep 4–6 h/week for me and I stay.</text>
<rect x="654" y="379" width="72" height="22" rx="11" fill="#8FA876" opacity=".18"/>
<text x="690" y="394" class="vote" fill="#8FA876">YES 62</text>
</g>
<g class="b" style="animation-name:m5">
<rect x="64" y="448" width="676" height="68" rx="12" class="bub"/>
<circle cx="36" cy="465" r="14" fill="#D97757"/>
<text x="36" y="470" class="ini">S</text>
<text x="78" y="469" class="who" fill="#D97757">skeptic</text>
<text x="78" y="490" class="head">Round 2 — correction: I counted A twice.</text>
<text x="78" y="510" class="line">Losing A after the contract costs 16 800 €, not 33 600 €.</text>
<rect x="654" y="457" width="72" height="22" rx="11" fill="#D97757" opacity=".18"/>
<text x="690" y="472" class="vote" fill="#D97757">NO 55</text>
</g>
<g class="b" style="animation-name:m6">
<rect x="64" y="526" width="676" height="88" rx="12" class="bub"/>
<circle cx="36" cy="543" r="14" fill="#D4A27F"/>
<text x="36" y="548" class="ini">M</text>
<text x="78" y="547" class="who" fill="#D4A27F">moderator</text>
<text x="78" y="568" class="head">PASSED · 4/5 YES (80 %) · weighted 82 %</text>
<text x="78" y="588" class="line">Take it only with a paid bridge for A + a notice clause.</text>
<text x="78" y="608" class="line">5 claims failed the evidence check and were dropped.</text>
</g>
</svg>
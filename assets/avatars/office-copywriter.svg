<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="office:copywriter"><style>
.av-bob{animation:av-bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.av-shadow{animation:av-shadow 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.av-eyes{animation:av-blink 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.av-acc{animation:av-acc 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes av-bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-3px) scale(.985,1.02)}55%{transform:translateY(-3px) scale(.985,1.02)}85%{transform:translateY(0) scale(1.03,.97)}}
@keyframes av-shadow{0%,100%{transform:scale(1,1);opacity:1}50%{transform:scale(.86,.86);opacity:.7}}
@keyframes av-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
@keyframes av-acc{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg) translateY(-1px)}}
@media (prefers-reduced-motion: reduce){.av-bob,.av-shadow,.av-eyes,.av-acc{animation:none}}
</style><defs>
<radialGradient id="a-b" cx="34%" cy="26%" r="80%"><stop offset="0" stop-color="#DACCE2"/><stop offset=".45" stop-color="#B49AC4"/><stop offset="1" stop-color="#826F8D"/></radialGradient>
<linearGradient id="a-ao" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#5A4D62" stop-opacity="0"/><stop offset="1" stop-color="#5A4D62" stop-opacity=".55"/></linearGradient>
<radialGradient id="a-rim" cx="78%" cy="70%" r="45%"><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFE7D6" stop-opacity=".35"/></radialGradient>
<radialGradient id="a-sp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<radialGradient id="a-sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="a-eye" cx="42%" cy="34%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F4EFE8"/><stop offset="1" stop-color="#D9D1C6"/></radialGradient>
<radialGradient id="a-iris" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#5A4A42"/><stop offset="1" stop-color="#1C1714"/></radialGradient>
<radialGradient id="a-ck" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF8F7E" stop-opacity=".55"/><stop offset="1" stop-color="#FF8F7E" stop-opacity="0"/></radialGradient>
<linearGradient id="a-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DACCE2"/><stop offset="1" stop-color="#826F8D"/></linearGradient>
<filter id="a-ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#000" flood-opacity=".35"/></filter>
</defs><ellipse class="av-shadow" style="animation-delay:-4.44s" cx="48" cy="90" rx="27" ry="4.5" fill="url(#a-sh)"/><g class="av-bob" style="animation-delay:-4.44s"><path d="M40 20 C62 14 84 30 82 54 C80 76 64 88 44 86 C24 84 12 70 14 50 C16 34 24 24 40 20 Z" fill="url(#a-b)"/><path d="M40 20 C62 14 84 30 82 54 C80 76 64 88 44 86 C24 84 12 70 14 50 C16 34 24 24 40 20 Z" fill="url(#a-ao)"/><path d="M40 20 C62 14 84 30 82 54 C80 76 64 88 44 86 C24 84 12 70 14 50 C16 34 24 24 40 20 Z" fill="url(#a-rim)"/><ellipse cx="34" cy="31" rx="11" ry="6" transform="rotate(-28 34 31)" fill="url(#a-sp)" opacity=".75"/><circle cx="27" cy="40" r="2.2" fill="#FFFFFF" opacity=".55"/><g class="av-acc" filter="url(#a-ds)" style="animation-delay:-4.44s"><path d="M88 8 L66 38 L62 44 L68 40 L90 10 Z" fill="#E3B25B" stroke="#2B2522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 44 L66 38" stroke="#2B2522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 14 L72 31" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".7" fill="none"/></g><ellipse cx="27" cy="63" rx="7" ry="4.5" fill="url(#a-ck)"/><ellipse cx="69" cy="63" rx="7" ry="4.5" fill="url(#a-ck)"/><g class="av-eyes" style="animation-delay:-14.44s"><path d="M30 53 Q36 45 42 53" stroke="#2B2522" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M54 53 Q60 45 66 53" stroke="#2B2522" stroke-width="3.4" fill="none" stroke-linecap="round"/></g><path d="M41 69 Q50 70.5 57 64" stroke="#2B2522" stroke-width="3.2" fill="none" stroke-linecap="round"/></g></svg>

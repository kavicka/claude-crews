<linearGradient id="a-lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECBBAB"/><stop offset="1" stop-color="#9C563F"/></linearGradient>
<filter id="a-ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#000" flood-opacity=".35"/></filter>
</defs><ellipse class="av-shadow" style="animation-delay:-4.07s" cx="48" cy="90" rx="27" ry="4.5" fill="url(#a-sh)"/><g class="av-bob" style="animation-delay:-4.07s"><path d="M48 12 C58 26 82 40 82 60 C82 76 68 86 48 86 C28 86 14 76 14 60 C14 40 38 26 48 12 Z" fill="url(#a-b)"/><path d="M48 12 C58 26 82 40 82 60 C82 76 68 86 48 86 C28 86 14 76 14 60 C14 40 38 26 48 12 Z" fill="url(#a-ao)"/><path d="M48 12 C58 26 82 40 82 60 C82 76 68 86 48 86 C28 86 14 76 14 60 C14 40 38 26 48 12 Z" fill="url(#a-rim)"/><ellipse cx="34" cy="31" rx="11" ry="6" transform="rotate(-28 34 31)" fill="url(#a-sp)" opacity=".75"/><circle cx="27" cy="40" r="2.2" fill="#FFFFFF" opacity=".55"/><g class="av-acc" filter="url(#a-ds)" style="animation-delay:-4.07s"><rect x="60" y="64" width="32" height="22" rx="3" fill="#FBF7F0" stroke="#2B2522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 66 L76 78 L92 66" stroke="#2B2522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="89" cy="64" r="5" fill="#D97757" stroke="#2B2522" stroke-width="2"/></g><ellipse cx="27" cy="63" rx="7" ry="4.5" fill="url(#a-ck)"/><ellipse cx="69" cy="63" rx="7" ry="4.5" fill="url(#a-ck)"/><g class="av-eyes" style="animation-delay:-14.07s"><path d="M30 53 Q36 45 42 53" stroke="#2B2522" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M54 53 Q60 45 66 53" stroke="#2B2522" stroke-width="3.4" fill="none" stroke-linecap="round"/></g><path d="M40 67 Q48 74.5 56 67" stroke="#2B2522" stroke-width="3.2" fill="none" stroke-linecap="round"/></g></svg>

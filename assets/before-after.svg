<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Same task, vibe coding versus crew:ship: hidden tests 11 of 12 versus 12 of 12, test suite 11 versus 23 tests, 67 seconds versus 13.8 minutes, 96 thousand versus 601 thousand subagent tokens">
  <style>
    text { font-family: "Styrene B", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F5F4EE; }
    .serif { font-family: "Tiempos Headline", "Copernicus", Georgia, "Times New Roman", serif; }
    .h { font-size: 13px; fill: #A8A59B; letter-spacing: .03em; }
    .t { font-size: 17px; }
    .s { font-size: 11.5px; fill: #A8A59B; }
    .lab { font-size: 12px; fill: #C9C6BC; }
    .val { font-size: 13px; font-weight: 600; }
    .vibe { fill: #6B6A64; }
    .crew { fill: #D97757; }
    .grid { stroke: #45443F; }
    .bad { fill: #E8A08A; font-size: 12.5px; font-weight: 600; }
  </style>
  <rect width="960" height="410" rx="14" fill="#262624"/>
  <text class="h" x="24" y="34">SAME TASK · "let checkout accept several coupon codes" · real run, 2026-11-03</text>
  <rect class="vibe" x="24" y="50" width="12" height="12" rx="2"/><text class="lab" x="42" y="60">vibe coding: one prompt, one agent (opus · medium)</text>
  <rect class="crew" x="380" y="50" width="12" height="12" rx="2"/><text class="lab" x="398" y="60">/crew:ship: planner → skeptic → coder + tester → reviewer → fix</text>

  <text class="t serif" x="24" y="102">Hidden acceptance tests</text>
  <text class="s" x="24" y="119">12 tests neither run saw · higher is better</text>
  <line class="grid" x1="24" y1="130" x2="444" y2="130"/>
  <rect class="vibe" x="24" y="138" width="367" height="20" rx="4"/><text class="val" x="399" y="153" style="fill:#C9C6BC">11/12</text>
  <rect class="crew" x="24" y="164" width="400" height="20" rx="4"/><text class="val" x="432" y="179" style="fill:#D97757">12/12</text>

  <text class="t serif" x="504" y="102">Tests in the suite afterwards</text>
  <text class="s" x="504" y="119">started with 4 · higher is better</text>
  <line class="grid" x1="504" y1="130" x2="924" y2="130"/>
  <rect class="vibe" x="504" y="138" width="191" height="20" rx="4"/><text class="val" x="703" y="153" style="fill:#C9C6BC">11</text>
  <rect class="crew" x="504" y="164" width="400" height="20" rx="4"/><text class="val" x="912" y="179" style="fill:#D97757">23</text>

  <text class="t serif" x="24" y="234">Agent wall-clock time</text>
  <text class="s" x="24" y="251">excludes the human checkpoint · lower is cheaper</text>
  <line class="grid" x1="24" y1="262" x2="444" y2="262"/>
  <rect class="vibe" x="24" y="270" width="32" height="20" rx="4"/><text class="val" x="64" y="285" style="fill:#C9C6BC">67 s</text>
  <rect class="crew" x="24" y="296" width="400" height="20" rx="4"/><text class="val" x="432" y="311" style="fill:#D97757">13.8 min</text>

  <text class="t serif" x="504" y="234">Subagent tokens</text>
  <text class="s" x="504" y="251">as reported by Claude Code, mostly cached prompt reads · lower is cheaper</text>
  <line class="grid" x1="504" y1="262" x2="924" y2="262"/>
  <rect class="vibe" x="504" y="270" width="64" height="20" rx="4"/><text class="val" x="576" y="285" style="fill:#C9C6BC">96 k</text>
  <rect class="crew" x="504" y="296" width="400" height="20" rx="4"/><text class="val" x="912" y="311" style="fill:#D97757">601 k</text>

  <text class="bad" x="24" y="356">Bug left in the vibe version: the same two coupons give a different price depending on the order you type them (1035 vs 1036 cents).</text>
  <text class="s" x="24" y="380">Found by the crew's reviewer, then confirmed against the vibe code. Raw diffs, transcripts and the hidden test file are in examples/coupon-demo.</text>
</svg>
